<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Moma admin</title>
<link rel="icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F6F3EE;--ink:#141414;--muted:#6F6A73;--line:#E9E4DE;--soft:#F1EDE8;--lav:#CFC4FA;--butter:#FFE08A;--sky:#AEDDF6;--pink:#FFB8D6;--lime:#DDF38C;--coral:#FF8B74;--mint:#A8E8CB;--peach:#FFC6A3;--red:#C62F1E;--ok:#1F7A4D}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}a{color:inherit}
.hidden{display:none!important}
.login{min-height:100%;display:grid;place-items:center;background:linear-gradient(180deg,#B4D7EE,#C3CCE9 55%,#F4E6DA);padding:20px}
.login .box{background:#fff;border-radius:32px;padding:32px;width:min(420px,100%);text-align:center}
.login img{width:120px;border-radius:26px}
.word{font-weight:800;letter-spacing:-1.5px;font-size:38px;margin:8px 0 0}
.login form{text-align:left}.login .btn{width:100%;margin-top:16px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
aside{background:var(--ink);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{display:flex;align-items:center;gap:10px;margin:0 8px 18px}
aside .brand img{width:40px;height:40px;border-radius:12px}
aside .brand b{font-size:24px;font-weight:800;letter-spacing:-1px}
aside .brand span{font-size:12px;opacity:.6;display:block;margin-top:-3px}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:99px;font-weight:500;color:#fff;opacity:.82}
nav button:hover{opacity:1;background:#262626}
nav button.on{background:#fff;color:var(--ink);opacity:1;font-weight:600}
nav .dot{width:10px;height:10px;border-radius:5px;flex:none}
nav .badge{margin-left:auto;background:var(--coral);color:var(--ink);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
nav .sep{height:1px;background:#2b2b2b;margin:8px 10px}
.who{margin-top:auto;padding:14px 10px 0;border-top:1px solid #2b2b2b;font-size:13.5px}
.who b{display:block;font-size:14.5px}.who .r{opacity:.65}
.who .links{display:flex;flex-direction:column;gap:6px;margin-top:10px;opacity:.8}.who .links a{cursor:pointer}
main{padding:26px 32px 60px;min-width:0}
h1{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px}}
.tile{border-radius:26px;padding:18px 20px;min-height:116px}
.tile .k{font-size:13.5px;font-weight:600;opacity:.75}.tile .v{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin-top:4px}.tile .h{font-size:13px;opacity:.75;margin-top:2px}
.card{background:#fff;border-radius:26px;padding:20px 22px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:18.5px;font-weight:700;letter-spacing:-.3px}
.card p.m{margin:0 0 14px;color:var(--muted);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:10px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:3px;position:relative}
.chart .b i{display:block;border-radius:6px 6px 2px 2px}
.chart .b:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:10px;white-space:nowrap;z-index:3}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:6px;background:var(--c)}
.bars .r{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bars .t{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bars .t i{display:block;height:100%;border-radius:6px}
.bars .n{text-align:right;font-weight:600}
.btn{border:0;border-radius:99px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.danger{background:var(--red)}
.btn.small{padding:7px 13px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:11px 15px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.45}
select.auto{width:auto}
label.l{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:#DDF5E8;color:var(--ok)}.p-bad{background:#FFE4DE;color:var(--red)}.p-warn{background:#FFF3CC;color:#8a6200}.p-mute{background:#EFEBE6;color:var(--muted)}.p-lav{background:#EAE4FF;color:#4B3A9A}.p-sky{background:#E1F3FC;color:#1D5E80}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF9F6}
.switch{position:relative;width:52px;height:30px;flex:none;display:inline-block}.switch input{display:none}
.switch span{position:absolute;inset:0;background:#DDD7D0;border-radius:99px;cursor:pointer;transition:.2s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ink)}.switch input:checked+span::after{left:25px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:500;z-index:50}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;background:var(--soft);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .c{opacity:.7;margin-left:4px}
/* support */
.desk{display:grid;grid-template-columns:330px 1fr 290px;gap:14px;height:calc(100vh - 150px);min-height:520px}
@media(max-width:1250px){.desk{grid-template-columns:300px 1fr}.desk .side{display:none}}
.pane{background:#fff;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.list{overflow:auto;flex:1}
.ci{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ci:hover{background:#FBF9F6}.ci.on{background:#F3EFFF}
.ci .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ci .p{color:var(--muted);font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.unread{background:var(--coral);border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:700}
.thread{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#FBF9F6}
.msg{max-width:78%;padding:11px 14px;border-radius:20px;line-height:1.45;white-space:pre-wrap;font-size:14.5px}
.msg .w{font-size:11.5px;color:var(--muted);margin-top:5px}
.msg.user{background:#fff;border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.staff{background:var(--lav);align-self:flex-end;border-bottom-right-radius:6px}
.msg.note{background:#FFF3CC;align-self:flex-end;border:1.5px dashed #E5C34F}
.msg.system{background:#FFE4DE;align-self:center;max-width:90%;font-size:13.5px;text-align:center}
.msg.event{background:transparent;align-self:center;color:var(--muted);font-size:12.5px;padding:2px}
.alert{background:#FFE4DE;color:#7a1d12;padding:12px 16px;font-size:14px;line-height:1.4}
.composer{border-top:1px solid var(--line);padding:12px}
.composer textarea{min-height:70px;border-radius:16px}
.composer.note textarea{background:#FFFBEA;border-color:#E5C34F}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
/* modal & drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:20;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:20px}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:24px}
.modal{background:#fff;border-radius:28px;padding:26px;width:min(460px,100%)}
.heat td{text-align:center;font-weight:600;font-size:13.5px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:10px 14px;border-radius:12px;font-size:16px;letter-spacing:.5px;display:inline-block}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="box">
    <img src="/icons/icon-512.png" alt="Moma characters" />
    <div class="word">moma</div>
    <p class="muted" style="margin:0 0 18px">Admin portal</p>
    <div id="setupNote" class="hidden" style="text-align:left;background:#FFF3CC;border-radius:18px;padding:14px 16px;font-size:14px;margin-bottom:12px"></div>
    <form id="loginForm">
      <div id="firstOwner" class="hidden" style="background:#EAE4FF;border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:6px">First sign-in: you'll become the owner. Use the ADMIN_PASSWORD you set in Vercel.</div>
      <label class="l hidden" id="nameL">Your name</label><input type="text" id="lname" class="hidden" autocomplete="name" />
      <label class="l">Email</label><input type="email" id="lemail" autocomplete="username" />
      <label class="l">Password</label><input type="password" id="lpw" autocomplete="current-password" />
      <button class="btn">Sign in</button>
      <p id="loginErr" style="color:var(--red);font-size:14px;min-height:20px;margin:12px 0 0;text-align:center"></p>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside>
    <div class="brand"><img src="/icons/icon-192.png" alt="" /><div><b>moma</b><span>admin</span></div></div>
    <nav id="nav"></nav>
    <div class="who"><b id="whoName"></b><span class="r" id="whoRole"></span>
      <div class="links"><a id="chgPw">Change password</a><a href="/" target="_blank">Open the app ↗</a><a id="logout">Sign out</a></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div class="toast hidden" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dmy = d => { if (!d) return '—'; const x = new Date(d); return `${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()}`; };
const tm = d => new Date(d).toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true });
const when = d => { if (!d) return '—'; const m = (Date.now() - new Date(d)) / 6e4; if (m < 1) return 'just now'; if (m < 60) return `${Math.round(m)} min ago`; if (m < 1440) return `${Math.round(m / 60)}h ago`; if (m < 2880) return 'yesterday'; return dmy(d); };
const short = k => { const [y, m, d] = k.split('-').map(Number); return `${d} ${MONTHS[m - 1].slice(0, 3)}`; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.add('hidden'), 2800); }
async function api(a, opt = {}) {
  const r = await fetch(`/api/admin?a=${a}${opt.q || ''}`, { method: opt.method || 'GET', headers: { 'content-type': 'application/json' }, body: opt.body ? JSON.stringify(opt.body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !['login', 'password'].includes(a)) { showLogin(); throw new Error('signed out'); }
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}
function csv(name, rows) {
  const s = rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv' })); a.download = name; a.click();
}
function bars(rows, color) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? `<div class="bars">${rows.map(([l, n, c, suffix]) => `<div class="r"><span>${esc(l)}</span><div class="t"><i style="width:${(n / max) * 100}%;background:${c || color}"></i></div><span class="n">${n}${suffix || ''}</span></div>`).join('')}</div>` : '<div class="empty">Nothing yet</div>';
}
function modal(html, cls = 'center') {
  $('#layer').innerHTML = `<div class="scrim ${cls}">${html}</div>`;
  const sc = $('#layer .scrim'); sc.onclick = e => { if (e.target === sc && !sc.dataset.lock) closeLayer(); };
  return sc;
}
const closeLayer = () => ($('#layer').innerHTML = '');

/* ---------- session ---------- */
let ME = null, PERMS = [], ROLES = {}, MATRIX = {}, AI = null, view = 'overview', poll = null;
const has = p => PERMS.includes(p);
async function showLogin(msg) {
  stopPoll(); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); closeLayer();
  $('#loginErr').textContent = msg || '';
  try {
    const s = await (await fetch('/api/admin?a=status')).json();
    const note = $('#setupNote');
    if (!s.db) { note.classList.remove('hidden'); note.innerHTML = '<b>One step left:</b> connect a database. In Vercel open your project → Storage → add <b>Neon Postgres</b> (free), then redeploy. You can sign in after that.'; }
    else if (!s.hasStaff && !s.passwordSet) { note.classList.remove('hidden'); note.innerHTML = '<b>Set ADMIN_PASSWORD</b> in Vercel → Settings → Environment Variables, then redeploy. You use it once to create the owner account.'; }
    else note.classList.add('hidden');
    const first = s.db && !s.hasStaff && s.passwordSet;
    ['firstOwner', 'nameL', 'lname'].forEach(id => $('#' + id).classList.toggle('hidden', !first));
  } catch {}
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try { await api('login', { method: 'POST', body: { email: $('#lemail').value, password: $('#lpw').value, name: $('#lname').value } }); $('#lpw').value = ''; boot(); }
  catch (err) { $('#loginErr').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('logout').catch(() => {}); showLogin(); };
$('#chgPw').onclick = () => passwordModal(false);
function passwordModal(forced) {
  const sc = modal(`<div class="modal"><h3 style="margin:0 0 4px;font-size:22px">${forced ? 'Choose your password' : 'Change password'}</h3>
    <p class="muted" style="margin:0 0 10px">${forced ? "You're using a temporary password. Pick your own to continue." : 'At least 10 characters.'}</p>
    ${forced ? '' : '<label class="l">Current password</label><input type="password" id="pwc" autocomplete="current-password" />'}
    <label class="l">New password</label><input type="password" id="pwn" autocomplete="new-password" />
    <p id="pwErr" style="color:var(--red);font-size:14px;min-height:18px"></p>
    <div class="row" style="justify-content:flex-end">${forced ? '' : '<button class="btn ghost" id="pwX">Cancel</button>'}<button class="btn" id="pwGo">Save password</button></div></div>`);
  if (forced) sc.dataset.lock = 1; else $('#pwX').onclick = closeLayer;
  $('#pwGo').onclick = async () => {
    try { await api('password', { method: 'POST', body: { current: forced ? '' : $('#pwc').value, next: $('#pwn').value } }); closeLayer(); toast('Password saved'); ME.mustReset = false; }
    catch (e) { $('#pwErr').textContent = e.message; }
  };
}
const NAV = [
  ['overview', 'Overview', 'stats', 'var(--lav)'], ['reports', 'Reports', 'reports', 'var(--butter)'], ['users', 'Users', 'users', 'var(--sky)'],
  ['support', 'Support inbox', 'support', 'var(--coral)'], 'sep', ['safety', 'Safety lab', 'safety', 'var(--peach)'], ['ai', 'AI console', 'safety', 'var(--pink)'],
  ['settings', 'App settings', 'guidance', 'var(--lime)'], ['feedback', 'Feedback', 'feedback', 'var(--mint)'], 'sep',
  ['team', 'Team & access', 'staff', 'var(--lav)'], ['audit', 'Audit log', 'audit', 'var(--sky)'], ['setup', 'Setup', 'settings', '#888'],
];
async function boot() {
  let r; try { r = await api('me'); } catch (e) { if (e.message !== 'signed out') showLogin(e.message); return; }
  ME = r.me; PERMS = r.perms; ROLES = r.roles; MATRIX = r.matrix; AI = r.ai;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#whoName').textContent = ME.name; $('#whoRole').textContent = ME.roleName;
  $('#nav').innerHTML = NAV.map(n => n === 'sep' ? '<div class="sep"></div>' : has(n[2]) ? `<button data-v="${n[0]}"><i class="dot" style="background:${n[3]}"></i>${n[1]}${n[0] === 'support' ? '<span class="badge hidden" id="supBadge"></span>' : ''}</button>` : '').join('').replace(/(<div class="sep"><\/div>)+$/, '');
  $$('#nav button').forEach(b => (b.onclick = () => show(b.dataset.v)));
  if (ME.mustReset) passwordModal(true);
  const first = NAV.find(n => n !== 'sep' && has(n[2]));
  show(location.hash.slice(1) && NAV.some(n => n[0] === location.hash.slice(1) && has(n[2])) ? location.hash.slice(1) : first[0]);
  if (has('support')) { badge(); setInterval(badge, 30000); }
}
async function badge() { try { const r = await api('inbox', { q: '&filter=open' }); const b = $('#supBadge'); b.textContent = r.counts.open; b.classList.toggle('hidden', !r.counts.open); } catch {} }
function stopPoll() { clearInterval(poll); poll = null; }
function show(v) {
  stopPoll(); view = v; closeLayer();
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  history.replaceState(null, '', '#' + v);
  $('#main').innerHTML = '<div class="empty">Loading…</div>';
  Promise.resolve(VIEWS[v]()).catch(e => { if (e.message !== 'signed out') $('#main').innerHTML = `<div class="card"><h3>Couldn't load this page</h3><p class="m">${esc(e.message)}</p></div>`; });
}
const rangeSel = (id, val) => `<select class="auto" id="${id}">${[[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days']].map(([v, l]) => `<option value="${v}" ${v == val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const VIEWS = {};

/* ---------- overview ---------- */
let RANGE = 30;
VIEWS.overview = async () => {
  const s = await api('overview', { q: `&days=${RANGE}` }), H = s.headline, T = s.totals, n = k => T[k] || 0;
  $('#main').innerHTML = `
    <div class="head"><div><h1>Overview</h1><p class="sub">How Moma is doing. People are counted by a random app id, never by name.</p></div>${rangeSel('rng', RANGE)}</div>
    <div class="grid g4">
      <div class="tile" style="background:var(--lav)"><div class="k">Active today</div><div class="v">${H.dau}</div><div class="h">${H.wau} this week · ${H.mau} this month</div></div>
      <div class="tile" style="background:var(--butter)"><div class="k">New users</div><div class="v">${H.new_users}</div><div class="h">${H.users} in total</div></div>
      <div class="tile" style="background:var(--sky)"><div class="k">Check-ins</div><div class="v">${n('checkin')}</div><div class="h">${n('ask')} Ask Moma questions</div></div>
      <div class="tile" style="background:var(--coral)"><div class="k">Open support chats</div><div class="v">${s.support.open}</div><div class="h">${s.support.urgent} urgent · ${s.support.unassigned} unassigned</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Daily activity</h3><p class="m">Hover a bar for the day's numbers.</p>

let LASTMSG = 0, NOTE = false;
async function loadConvo(id, fresh) {

  const lastId = r.messages.length ? r.messages[r.messages.length - 1].id : 0;
  if (!fresh && lastId === LASTMSG && $('#cmsgs')) { renderSide(r); return; }
  LASTMSG = lastId;
  const draft = $('#ctext') ? $('#ctext').value : '';
  $('#sthread').innerHTML = `
    <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><b style="font-size:17px">${esc(u.name || 'Anonymous')}</b> <span class="muted small">#${u.short} · ${esc(u.stage)} · ${esc(u.country || '')}</span></div>
      <div class="row">${c.status !== 'resolved' ? '<button class="btn small" id="cres">Resolve</button>' : '<button class="btn ghost small" id="creo">Reopen</button>'}</div></div>
    ${c.flagged ? `<div class="alert"><b>Red flag: ${esc(c.flagged)}.</b> Moma already sent this person emergency guidance. Don't give medical advice. Check they've contacted their maternity team or emergency services, and loop in your clinical lead.</div>` : ''}
    <div class="thread" id="cmsgs">${r.messages.map(m => {
      if (m.from === 'system' && m.internal) return `<div class="msg event">${esc(m.body)} · ${tm(m.at)}</div>`;
      const cls = m.from === 'user' ? 'user' : m.from === 'system' ? 'system' : m.internal ? 'note' : 'staff';
      const who = m.from === 'user' ? (u.name || 'User') : m.from === 'system' ? 'Automatic safety message' : `${m.staff || 'Team'}${m.internal ? ' · internal note' : ''}`;
      return `<div class="msg ${cls}">${esc(m.body)}<div class="w">${esc(who)} · ${dmy(m.at)}, ${tm(m.at)}</div></div>`;
    }).join('')}</div>
    <div class="composer ${NOTE ? 'note' : ''}" id="comp">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div class="tabs"><button id="mReply" class="${NOTE ? '' : 'on'}">Reply to user</button><button id="mNote" class="${NOTE ? 'on' : ''}">Internal note</button></div>
        <select class="auto" id="quick"><option value="">Quick replies</option>${QUICK.map((q, i) => `<option value="${i}">${q[0]}</option>`).join('')}</select></div>
      <textarea id="ctext" placeholder="${NOTE ? 'Only your team sees notes' : 'Write a reply. Ctrl+Enter to send'}"></textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted small">${NOTE ? 'Not sent to the user.' : 'Sends to the user in the app.'}</span><button class="btn" id="csend">${NOTE ? 'Add note' : 'Send reply'}</button></div></div>`;
  $('#ctext').value = draft;
  const box = $('#cmsgs'); box.scrollTop = box.scrollHeight;

    ${r.past.length ? `<h3 style="margin:22px 0 8px">Earlier chats</h3>${r.past.map(p => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="#" data-p="${p.id}"><b>#${p.id}</b></a> · ${dmy(p.created_at)}<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.last_preview || '')}</div></div>`).join('')}` : ''}
    ${has('users') ? `<button class="btn ghost small" id="sprof" style="margin-top:16px">View full profile</button>` : ''}`;
  $('#sassign').onchange = e => patch({ assignedTo: e.target.value || null }, 'Assignment updated');
  const m = $('#smine'); if (m) m.onclick = () => patch({ assignedTo: ME.id }, 'Assigned to you');
  $('#sstatus').onchange = e => patch({ status: e.target.value }, 'Status updated');
  $('#sprio').onchange = e => patch({ priority: e.target.value }, 'Priority updated');
  $$('[data-p]').forEach(a => (a.onclick = e => { e.preventDefault(); OPEN = +a.dataset.p; loadConvo(OPEN, true); }));
  const pf = $('#sprof'); if (pf) pf.onclick = () => userDrawer(u.id);
}

/* ---------- safety lab ---------- */
const CASES = [
  ['My baby is moving less than usual today', 'pregnant', ['mv']], ["I haven't felt the baby move since this morning", 'pregnant', ['mv']], ['baby hasnt kicked much today', 'pregnant', ['mv']],
  ["Baby's movements feel slower and weaker", 'pregnant', ['mv']], ["I'm bleeding heavily and passing large clots", 'postpartum', ['hb']], ['Soaking a pad every hour, is that normal?', 'postpartum', ['hb']],
  ['I have a really bad headache and blurry vision', 'pregnant', ['pe']], ['seeing flashing lights and my face is puffy', 'pregnant', ['pe', 'sw']], ['I think my waters have broken, I am 33 weeks', 'pregnant', ['wb']],
  ['my temperature is 38.5 and I have chills', 'postpartum', ['fv']], ["chest pain and I can't breathe properly", 'pregnant', ['cp']], ['My left calf is swollen and hot', 'postpartum', ['dv']],
  ['My palms and the soles of my feet are so itchy at night', 'pregnant', ['ic']], ['Sometimes I feel like I want to die', 'postpartum', ['mh']], ["I can't go on like this", 'postpartum', ['mh']],
  ["Severe stomach pain that won't go away", 'pregnant', ['ap']], ['A tiny bit of spotting after sex', 'pregnant', ['bl']], ['What can I eat for heartburn?', 'pregnant', []],
  ['Is it ok to drink coffee?', 'pregnant', []], ['How often should a newborn feed?', 'postpartum', []], ['Baby is kicking loads tonight!', 'pregnant', []],
  ['When can I start running again?', 'postpartum', []], ['I feel a bit tired today', 'pregnant', []], ['Is it normal to feel emotional on day 4?', 'postpartum', []],
];
VIEWS.safety = () => {
  $('#main').innerHTML = `<h1>Safety lab</h1><p class="sub">Runs messages through the same red-flag rules the app and the support chat use, before any AI or person sees them.</p>
    <div class="grid g3" style="margin-bottom:14px">
      <div class="tile" style="background:var(--coral)"><div class="k">Urgent cases caught</div><div class="v" id="s-recall">–</div><div class="h">the number that matters most</div></div>
      <div class="tile" style="background:var(--mint)"><div class="k">Calm cases left alone</div><div class="v" id="s-spec">–</div><div class="h">no false alarm</div></div>
      <div class="tile" style="background:var(--butter)"><div class="k">Test cases</div><div class="v">${CASES.length}</div><div class="h" id="s-h">built-in set</div></div></div>
    <div class="card"><div class="head"><div><h3>Built-in test set</h3><p class="m" style="margin:0">Real-world phrasings, including ones written the "wrong" way round.</p></div><button class="btn" id="runEval">Run all tests</button></div>
      <div style="overflow:auto;margin-top:14px"><table><thead><tr><th>Message</th><th>Stage</th><th>Expected</th><th>Result</th></tr></thead><tbody id="evalBody"></tbody></table></div></div>
    <div class="card"><h3>Try a message</h3><p class="m">See exactly which rules fire.</p>
      <div class="row"><input type="text" id="tryText" placeholder="e.g. baby hasn't kicked much since this morning" style="flex:1;min-width:220px" /><select class="auto" id="tryMode"><option value="pregnant">Pregnant</option><option value="postpartum">Postpartum</option></select><button class="btn" id="tryBtn">Check</button></div>
      <div id="tryOut" style="margin-top:12px"></div></div>`;
  const render = results => {
    let urg = 0, urgOk = 0, calm = 0, calmOk = 0;
    $('#evalBody').innerHTML = CASES.map(([t, m, exp], i) => {
      const r = results ? results[i] : null; let res = '<span class="pill p-mute">Not run</span>';
      if (r) {
        const pass = exp.length ? exp.every(id => r.ids.includes(id)) : r.ids.length === 0;
        if (exp.length) { urg++; if (pass) urgOk++; } else { calm++; if (pass) calmOk++; }
        res = pass ? '<span class="pill p-ok">Pass</span>' : `<span class="pill p-bad">${exp.length ? 'Missed' : 'False alarm'}</span>`;
        if (r.titles.length) res += `<div class="muted small" style="margin-top:4px">${esc(r.titles.join(', '))}</div>`;
      }
      return `<tr><td>${esc(t)}</td><td>${m === 'pregnant' ? 'Pregnant' : 'Postpartum'}</td><td>${exp.length ? exp.map(x => `<span class="pill p-warn">${x}</span>`).join(' ') : '<span class="pill p-mute">No flag</span>'}</td><td>${res}</td></tr>`;
    }).join('');
    if (results) { $('#s-recall').textContent = `${urgOk}/${urg}`; $('#s-spec').textContent = `${calmOk}/${calm}`; $('#s-h').textContent = `last run ${tm(Date.now())}`; }
  };
  render(null);
  $('#runEval').onclick = async () => { $('#runEval').disabled = true; try { render((await api('triage', { method: 'POST', body: { cases: CASES.map(([text, mode]) => ({ text, mode })) } })).results); toast('Tests finished'); } catch (e) { toast(e.message); } finally { $('#runEval').disabled = false; } };
  $('#tryBtn').onclick = async () => {
    const text = $('#tryText').value.trim(); if (!text) return;
    const r = (await api('triage', { method: 'POST', body: { cases: [{ text, mode: $('#tryMode').value }] } })).results[0];
    const lv = { m: ['Mental health emergency', 'p-bad'], e: ['Emergency: call 999', 'p-bad'], u: ['Urgent: contact maternity triage now', 'p-bad'], s: ['Worth checking today', 'p-warn'] }[r.level];
    $('#tryOut').innerHTML = r.level ? `<span class="pill ${lv[1]}">${lv[0]}</span> <span class="muted" style="margin-left:6px">${esc(r.titles.join(', '))}</span>` : '<span class="pill p-ok">No red flag</span> <span class="muted">Handled normally.</span>';
  };
  $('#tryText').onkeydown = e => { if (e.key === 'Enter') $('#tryBtn').click(); };
};

/* ---------- AI console ---------- */
VIEWS.ai = () => {
  $('#main').innerHTML = `<h1>AI console</h1><p class="sub">Ask Moma a test question as a pretend user. Nothing here is stored. ${AI ? `Model: ${esc(AI)}.` : '<b>No AI key is set yet.</b>'}</p>
    <div class="card"><div class="grid g3">
      <div><label class="l" style="margin-top:0">Stage</label><select id="aiMode"><option value="pregnant">Pregnant</option><option value="postpartum">Postpartum</option></select></div>
      <div><label class="l" style="margin-top:0" id="aiWeekL">Week of pregnancy</label><input type="text" id="aiWeek" value="20" /></div>
      <div><label class="l" style="margin-top:0">Country</label><select id="aiCountry">${['UK', 'Canada', 'US', 'Nigeria', 'Other'].map(c => `<option>${c}</option>`).join('')}</select></div></div>
      <label class="l">Question</label><textarea id="aiQ" placeholder="e.g. Is it safe to have a bath at 20 weeks?"></textarea>
      <div class="row" style="margin-top:12px;justify-content:space-between"><label class="row" style="gap:8px;font-size:14px"><span class="switch"><input type="checkbox" id="aiGuid" checked /><span></span></span>Include team guidance from App settings</label><button class="btn" id="aiBtn">Ask Moma</button></div></div>
    <div id="aiOut"></div>`;
  $('#aiMode').onchange = () => { const pp = $('#aiMode').value === 'postpartum'; $('#aiWeekL').textContent = pp ? "Baby's age in weeks" : 'Week of pregnancy'; $('#aiWeek').value = pp ? 2 : 20; };
  $('#aiBtn').onclick = async () => {
    const q = $('#aiQ').value.trim(); if (!q) return; $('#aiBtn').disabled = true; $('#aiBtn').textContent = 'Thinking…';
    try {
      const r = await api('test', { method: 'POST', body: { message: q, mode: $('#aiMode').value, week: $('#aiWeek').value, country: $('#aiCountry').value, useGuidance: $('#aiGuid').checked } });
      const flag = r.triage.level ? `<span class="pill p-bad">Red flag shown first: ${esc(r.triage.titles.join(', '))}</span>` : '<span class="pill p-ok">No red flag</span>';
      $('#aiOut').innerHTML = `<div class="card"><div class="head"><h3>Moma's answer</h3><div class="row">${flag}${r.ms ? `<span class="pill p-mute">${(r.ms / 1000).toFixed(1)}s</span>` : ''}</div></div><div style="margin-top:12px">${r.reply ? `<div class="msg staff" style="max-width:100%">${esc(r.reply)}</div>` : `<p class="muted">${esc(r.error)}</p>`}</div></div>`;
    } catch (e) { $('#aiOut').innerHTML = `<div class="card"><p style="color:var(--red)">${esc(e.message)}</p></div>`; }
    finally { $('#aiBtn').disabled = false; $('#aiBtn').textContent = 'Ask Moma'; }
  };
};

/* ---------- settings ---------- */

    <div class="card"><div class="head"><div><h3>Announcement banner</h3><p class="m" style="margin:0">Shown at the top of the Today screen.</p></div><label class="switch"><input type="checkbox" id="annOn" ${c.announcementOn ? 'checked' : ''} ${dis} /><span></span></label></div>
      <label class="l">Message (280 characters max)</label><textarea id="ann" maxlength="280" style="min-height:70px" ${dis} placeholder="e.g. New: summarise your week for your midwife from the Ask tab.">${esc(c.announcement)}</textarea></div>
    <div class="grid g2">
      <div class="card"><div class="head"><div><h3>Ask Moma</h3><p class="m" style="margin:0">Pause the AI, for example while you change models. Red-flag safety messages keep working either way.</p></div><label class="switch"><input type="checkbox" id="askOn" ${c.askEnabled !== false ? 'checked' : ''} ${dis} /><span></span></label></div></div>
      <div class="card"><div class="head"><div><h3>Live support</h3><p class="m" style="margin:0">When off, the app tells people the team is offline.</p></div><label class="switch"><input type="checkbox" id="supOn" ${c.supportOn !== false ? 'checked' : ''} ${dis} /><span></span></label></div>
        <label class="l">Reply time shown in the app</label><input type="text" id="supHours" maxlength="140" value="${esc(c.supportHours)}" ${dis} /></div>
    </div>
    <div class="card"><h3>Team guidance for the AI</h3><p class="m">Extra instructions added to every Ask Moma conversation, on top of the built-in safety rules. Test them in the AI console first.</p>
      <textarea id="guid" maxlength="2000" placeholder="e.g. When someone asks about the flu jab, mention it is offered free to pregnant women in the UK.">${esc(c.guidance)}</textarea></div>
    <div class="row"><button class="btn" id="saveCfg">Save settings</button><span class="muted small">${c.updatedAt ? `Last saved ${dmy(c.updatedAt)} at ${tm(c.updatedAt)}${c.updatedBy ? ` by ${esc(c.updatedBy)}` : ''}` : ''}</span></div>`;

/* ---------- feedback ---------- */
VIEWS.feedback = async () => {
  const r = await api('feedback');
  $('#main').innerHTML = `<div class="head"><div><h1>Feedback</h1><p class="sub">What people chose to send from the Me screen. Newest first.</p></div><div class="row"><button class="btn ghost small" id="fbCsv">Download CSV</button>${has('settings') ? '<button class="btn ghost small" id="fbClear">Clear all</button>' : ''}</div></div>
    <div class="card">${r.items.length ? r.items.map(f => `<div style="border-bottom:1px solid var(--line);padding:14px 0"><div>${esc(f.text)}</div><div class="row small muted" style="margin-top:6px;gap:6px"><span>${dmy(f.created_at)}</span>${f.stage ? `<span class="pill p-mute">${esc(f.stage)}</span>` : ''}${f.country ? `<span class="pill p-mute">${esc(f.country)}</span>` : ''}${f.version ? `<span class="pill p-mute">v${esc(f.version)}</span>` : ''}</div></div>`).join('') : '<div class="empty">No feedback yet.</div>'}</div>`;
  $('#fbCsv').onclick = () => csv('moma-feedback.csv', [['date', 'stage', 'country', 'feedback'], ...r.items.map(f => [dmy(f.created_at), f.stage, f.country, f.text])]);
  const cl = $('#fbClear'); if (cl) cl.onclick = async () => { if (!confirm('Delete all feedback? This cannot be undone.')) return; await api('feedback', { method: 'DELETE' }); show('feedback'); };

/* ---------- team & access ---------- */
const PDESC = { stats: 'See the overview', reports: 'Reports and exports', users: 'See users', users_delete: 'Delete users', support: 'Answer support chats', safety: 'Safety lab and AI console', guidance: 'Edit AI guidance', settings: 'Change app settings', feedback: 'Read feedback', staff: 'Manage the team', audit: 'Read the audit log' };
const RDESC = { owner: 'Everything, including adding admins', admin: 'Runs the portal and the team', clinician: 'Clinical oversight: support, safety, AI guidance', support: 'Answers users in the support inbox', analyst: 'Stats and reports, no personal details' };
VIEWS.team = async () => {
  const r = await api('staff'), canEdit = s => ME.role === 'owner' || !['owner', 'admin'].includes(s.role);
  const roleOpts = sel => Object.entries(ROLES).filter(([k]) => ME.role === 'owner' || !['owner', 'admin'].includes(k)).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
  $('#main').innerHTML = `<div class="head"><div><h1>Team & access</h1><p class="sub">Everyone who can sign in to this portal, and what each access level can do.</p></div><button class="btn" id="addM">Add team member</button></div>
    <div class="card"><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Email</th><th>Access level</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead><tbody>
    ${r.items.map(s => `<tr><td><b>${esc(s.name)}</b>${s.id === ME.id ? ' <span class="muted small">(you)</span>' : ''}</td><td>${esc(s.email)}</td>
      <td>${canEdit(s) && s.id !== ME.id ? `<select class="auto" data-role="${s.id}">${roleOpts(s.role)}</select>` : `<span class="pill p-lav">${s.roleName}</span>`}</td>
      <td>${s.active ? (s.mustReset ? '<span class="pill p-warn">Invited</span>' : '<span class="pill p-ok">Active</span>') : '<span class="pill p-mute">Switched off</span>'}</td>
      <td>${s.lastLogin ? when(s.lastLogin) : '<span class="muted">Never</span>'}</td>
      <td style="text-align:right">${canEdit(s) && s.id !== ME.id ? `<div class="row" style="justify-content:flex-end;gap:6px"><button class="btn ghost small" data-reset="${s.id}">Reset password</button><button class="btn ghost small" data-act="${s.id}" data-on="${s.active ? 0 : 1}">${s.active ? 'Switch off' : 'Switch on'}</button></div>` : ''}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card"><h3>Access levels</h3><p class="m">What each level can do.</p><div style="overflow:auto"><table class="matrix"><thead><tr><th></th>${Object.entries(ROLES).map(([k, v]) => `<th>${v}</th>`).join('')}</tr></thead><tbody>
      <tr><td class="muted small">Who it's for</td>${Object.keys(ROLES).map(k => `<td class="muted small">${RDESC[k]}</td>`).join('')}</tr>
      ${Object.entries(PDESC).map(([p, d]) => `<tr><td>${d}</td>${Object.keys(ROLES).map(k => `<td>${(MATRIX[p] || []).includes(k) ? '<span class="pill p-ok">✓</span>' : '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  $$('[data-role]').forEach(sel => (sel.onchange = async () => { try { await api('staff', { method: 'PATCH', body: { id: +sel.dataset.role, role: sel.value } }); toast('Access level updated'); } catch (e) { toast(e.message); show('team'); } }));
  $$('[data-act]').forEach(b => (b.onclick = async () => { const on = b.dataset.on === '1'; if (!on && !confirm('Switch off this account? They will be signed out and their open chats unassigned.')) return; try { await api('staff', { method: 'PATCH', body: { id: +b.dataset.act, active: on } }); toast(on ? 'Account switched on' : 'Account switched off'); show('team'); } catch (e) { toast(e.message); } }));
  $$('[data-reset]').forEach(b => (b.onclick = async () => { if (!confirm('Give this person a new temporary password?')) return; try { const x = await api('staff', { method: 'PATCH', body: { id: +b.dataset.reset, resetPassword: true } }); tempModal('New temporary password', x.tempPassword); } catch (e) { toast(e.message); } }));
  $('#addM').onclick = () => {
    modal(`<div class="modal"><h3 style="margin:0 0 4px;font-size:22px">Add team member</h3><p class="muted" style="margin:0">They'll get a temporary password and choose their own on first sign-in.</p>
      <label class="l">Name</label><input type="text" id="mn" /><label class="l">Work email</label><input type="email" id="me" />
      <label class="l">Access level</label><select id="mr">${roleOpts('support')}</select><p class="muted small" id="mrd" style="margin:6px 0 0">${RDESC.support}</p>
      <p id="mErr" style="color:var(--red);font-size:14px;min-height:18px"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mx">Cancel</button><button class="btn" id="mgo">Add</button></div></div>`);
    $('#mr').onchange = e => ($('#mrd').textContent = RDESC[e.target.value]);
    $('#mx').onclick = closeLayer;
    $('#mgo').onclick = async () => { try { const x = await api('staff', { method: 'POST', body: { name: $('#mn').value, email: $('#me').value, role: $('#mr').value } }); tempModal(`${x.member.name} is on the team`, x.tempPassword, x.member.email); show('team'); } catch (e) { $('#mErr').textContent = e.message; } };
  };
};
function tempModal(title, pw, email) {
  setTimeout(() => {
    modal(`<div class="modal"><h3 style="margin:0 0 6px;font-size:22px">${esc(title)}</h3><p class="muted">Share this privately. It's shown once, and they'll choose a new password when they sign in at <b>${location.origin}/admin</b>${email ? ` with <b>${esc(email)}</b>` : ''}.</p>
      <div class="code">${esc(pw)}</div><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" id="cp">Copy</button><button class="btn" id="ok">Done</button></div></div>`).dataset.lock = 1;
    $('#cp').onclick = () => navigator.clipboard.writeText(pw).then(() => toast('Copied'));
    $('#ok').onclick = closeLayer;
  }, 50);
}
